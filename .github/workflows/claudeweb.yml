name: einsteinOS

on:
  push:
    branches: [ "claudeweb" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Build core OS packages
      run: go build ./kernel/ ./fs/ ./mm/ ./blk_drv/ ./chr_drv/ ./include/ ./init/ ./lib/

    - name: Build model
      run: go build ./model/claudeweb/

    - name: Build REPL
      run: go build ./examples/claudeweb/

    - name: Line count check
      run: |
        LINES=$(find kernel/ fs/ mm/ blk_drv/ chr_drv/ include/ init/ lib/ -name '*.go' -exec cat {} + | wc -l)
        echo "Core OS lines: $LINES"
        if [ "$LINES" -lt 14000 ]; then
          echo "FAIL: need >= 14000 lines, got $LINES"
          exit 1
        fi
